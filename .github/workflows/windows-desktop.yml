name: Windows desktop

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-desktop:
    name: Windows / desktop E2E and installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Build desktop renderer
        working-directory: frontend
        run: npm run desktop:build

      - name: Run desktop end-to-end tests
        working-directory: frontend
        run: npm run desktop:test:e2e

      - name: Create Windows installer
        working-directory: frontend
        run: npm run desktop:make

      - name: Scan Windows installer contents
        working-directory: frontend
        run: npm run desktop:verify-package
